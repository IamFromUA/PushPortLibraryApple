name: Verify Apple SDK
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional released version to verify in the independent consumer
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build and test Swift, iOS and extension
        run: bash scripts/verify-ios.sh
      - name: Verify independent app consuming the public package
        env:
          PUSHPORT_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.package_version || '' }}
        run: bash scripts/verify-consumer.sh
      - name: Build DocC documentation
        run: xcodebuild docbuild -scheme PushPort-Package -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/documentation CODE_SIGNING_ALLOWED=NO
      - name: Keep documentation archives
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: .build/documentation/Build/Products/Debug-iphonesimulator/*.doccarchive
          if-no-files-found: error
          retention-days: 7
      - name: Keep native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-results
          path: .build/ios/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
